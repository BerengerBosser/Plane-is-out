<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio son · Plane is out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>/* Studio son : mêmes couleurs et polices que le jeu */
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --ink: #10162b; --ink-2: #1b2340; --ink-3: #26305a; --deep: #0b1022; --line: #34407a;
  --coral: #ff6b5b; --sun: #ffd166; --mint: #5ef2c2; --lilac: #b8a4ff; --cream: #fff4e0;
  --text: #fff4e0; --muted: #b9bfdc; --dim: #7c84ab; --danger: #ff5a5a;
  --f-display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --f-body: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); }
body { font-family: var(--f-body); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
kbd { font-family: var(--f-body); font-weight: 800; background: var(--sun); color: var(--ink); border-radius: 5px; padding: 0 6px; font-size: .8em; box-shadow: 0 2px 0 #b8902e; }
code { background: var(--ink-3); padding: 1px 6px; border-radius: 5px; font-size: .92em; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

.studio { position: fixed; inset: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr) 290px; grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "ban ban ban" "left main right" "keys keys keys"; }
.studio.dragging [data-drop] { outline: 2px dashed rgba(94,242,194,.35); outline-offset: -2px; }
.studio .over { outline: 2px solid var(--mint) !important; background: rgba(94,242,194,.1) !important; }

/* ── barre du haut ── */
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--ink-2); border-bottom: 2px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand i { font-style: normal; font-size: 20px; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--sun); letter-spacing: .5px; }
.brand small { color: var(--dim); font-weight: 700; }
.views { display: flex; gap: 4px; background: var(--deep); padding: 4px; border-radius: 999px; border: 2px solid var(--line); }
.views button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 800; color: var(--muted); }
.views button:hover { color: var(--cream); }
.views button.on { background: var(--cream); color: var(--ink); }
.st { display: flex; gap: 8px; margin-left: auto; min-width: 0; flex: 1 1 0; justify-content: flex-end; }
.pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 1400px) { .brand small { display: none; } .acts .btn kbd { display: none; } }
.pill.ok { border-color: rgba(94,242,194,.6); color: var(--mint); }
.pill.warn { border-color: rgba(255,209,102,.6); color: var(--sun); }
.pill.bad { border-color: rgba(255,90,90,.6); color: var(--danger); }
.acts { display: flex; gap: 8px; align-items: center; }
.ib { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--ink); font-size: 16px; font-weight: 800; display: grid; place-items: center; list-style: none; }
.ib:hover:not(:disabled) { border-color: var(--cream); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 12px; border: 2px solid var(--cream); background: var(--ink); font-weight: 800; box-shadow: 3px 3px 0 var(--deep); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--coral); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--deep); }
.btn.primary { background: var(--sun); color: var(--ink); }
.btn.primary kbd { background: var(--ink); color: var(--sun); box-shadow: none; }
.save { position: relative; }
.save.dirty::after { content: ''; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink-2); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }
.more { position: relative; }
.more summary::-webkit-details-marker { display: none; }
.more .menu { position: absolute; right: 0; top: 42px; z-index: 30; min-width: 320px; background: var(--ink-2); border: 2px solid var(--cream); border-radius: 14px; padding: 6px; box-shadow: 6px 6px 0 var(--mint); display: grid; }
.more .menu button { text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 9px; font-weight: 700; }
.more .menu button:hover { background: var(--ink-3); }
.more .menu .danger { color: var(--danger); }
.banner { grid-area: ban; padding: 9px 16px; background: rgba(255,90,90,.12); border-bottom: 2px solid rgba(255,90,90,.4); font-weight: 600; }

/* ── liste des sons ── */
.left { grid-area: left; display: flex; flex-direction: column; min-height: 0; border-right: 2px solid var(--line); background: var(--ink); }
.search, .lSearch { margin: 12px 12px 6px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--deep); outline: none; }
.search:focus, .lSearch:focus { border-color: var(--mint); }
.heard { margin: 0 12px 6px; padding: 7px 8px; border-radius: 10px; background: rgba(94,242,194,.07); border: 1.5px dashed rgba(94,242,194,.35); }
.heard small { display: block; color: var(--mint); font-weight: 800; font-size: 11px; margin-bottom: 4px; }
.heard div { display: flex; flex-wrap: wrap; gap: 4px; }
.heard button { border: 0; background: var(--ink-3); border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; }
.heard button:hover { background: var(--mint); color: var(--ink); }
.sList { flex: 1; overflow: auto; padding: 0 8px 12px; }
.grp h4 { margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.snd { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 26px; align-items: center; gap: 8px; width: 100%; padding: 5px 6px 5px 10px; border-radius: 10px; cursor: pointer; border: 1.5px solid transparent; }
.snd:hover { background: var(--ink-2); }
.snd.on { background: var(--cream); color: var(--ink); }
.snd.on small { color: #5a5a7a; }
.snd span { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snd small { color: var(--dim); font-size: 11px; font-weight: 700; white-space: nowrap; }
.snd.bad small { color: var(--danger); }
.snd .pl { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink-3); font-size: 10px; opacity: .65; }
.snd:hover .pl, .snd .pl.on { opacity: 1; }
.snd .pl.on { background: var(--coral); }
.snd.on .pl { background: var(--ink); color: var(--cream); }
.snd.hit { animation: hit .7s ease-out; }
@keyframes hit { 0% { box-shadow: inset 0 0 0 2px var(--mint), 0 0 18px rgba(94,242,194,.6); } 100% { box-shadow: inset 0 0 0 2px transparent, 0 0 0 transparent; } }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lilac); }
.dot.file { background: var(--mint); box-shadow: 0 0 8px rgba(94,242,194,.6); }
.dot.file.empty { background: transparent; border: 2px solid var(--mint); box-shadow: none; }
.dot.off { background: var(--line); }
.sum { padding: 9px 14px; border-top: 2px solid var(--line); color: var(--muted); font-size: 12px; }
.sum b { color: var(--sun); }
.empty { color: var(--dim); padding: 10px; font-style: italic; }

/* ── zone centrale ── */
.sMain { grid-area: main; overflow: auto; padding: 20px 26px 40px; min-width: 0; }
.head { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.ttl { min-width: 0; }
.ttl h1 { margin: 6px 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--sun); line-height: 1.1; }
.ttl p { margin: 0; color: var(--muted); max-width: 720px; line-height: 1.45; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 2px 9px; border-radius: 999px; background: var(--ink-3); font-size: 12px; font-weight: 800; color: var(--muted); }
.chip.mono { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
.tr { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.bigplay { width: 58px; height: 58px; border-radius: 50%; border: 3px solid var(--cream); background: var(--sun); color: var(--ink); font-size: 22px; font-weight: 900; box-shadow: 4px 4px 0 var(--deep); transition: transform .08s, box-shadow .08s; }
.bigplay:hover { transform: translate(-1px, -1px) scale(1.04); box-shadow: 5px 5px 0 var(--coral); }
.bigplay:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--deep); }
.bigplay.on { background: var(--coral); color: var(--cream); animation: pulse 1.4s infinite; }
.ghost { padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: transparent; font-weight: 800; color: var(--muted); }
.ghost:hover { border-color: var(--cream); color: var(--cream); }
.seg { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { padding: 8px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--ink); font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.seg button[data-src=synth].on { background: var(--lilac); border-color: var(--lilac); }
.seg button[data-src=off].on { background: var(--line); color: var(--cream); border-color: var(--line); }
.segNote { color: var(--dim); font-weight: 600; margin-left: 6px; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; margin-bottom: 12px; border-radius: 14px; border: 2px dashed var(--line); min-height: 50px; }
.var { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 6px; border-radius: 10px; background: var(--ink-2); border: 2px solid var(--line); font-weight: 700; cursor: pointer; max-width: 280px; }
.var b { background: var(--ink-3); border-radius: 6px; padding: 0 6px; font-size: 12px; }
.var span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.var button { border: 0; background: transparent; color: var(--dim); padding: 0 4px; }
.var button:hover { color: var(--danger); }
.var.on { border-color: var(--mint); background: rgba(94,242,194,.12); }
.var.on b { background: var(--mint); color: var(--ink); }
.var.miss { border-color: var(--danger); }
.var.miss span { color: var(--danger); text-decoration: line-through; }
.var.add { background: transparent; border-style: dashed; color: var(--mint); padding: 6px 12px; }
.variants .hint { color: var(--dim); font-size: 12.5px; margin-left: 4px; }

.waveBox, .trackEd { border: 2px solid var(--line); border-radius: 16px; background: var(--deep); overflow: hidden; margin-bottom: 14px; }
.trackEd { margin-top: 18px; padding-bottom: 10px; }
.trackEd .grid2 { padding: 4px 14px 0; }
.wtools { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--ink-2); border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.wtools b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
.wtools .grow { flex: 1; }
.wtools button, .calBtns button { padding: 5px 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--ink); font-weight: 700; font-size: 12.5px; }
.wtools button:hover, .calBtns button:hover { border-color: var(--sun); color: var(--sun); }
.wslot { height: 200px; }
.wv { display: block; width: 100%; height: 100%; touch-action: none; }
.wstats { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 8px 12px; color: var(--muted); font-weight: 600; font-size: 13px; border-top: 1px solid var(--ink-3); }
.wstats b { color: var(--cream); font-variant-numeric: tabular-nums; }
.wstats b.warn { color: var(--danger); }
.wstats input { width: 76px; padding: 3px 6px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--dim); }
h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 6px; }
h3.sep { margin-top: 26px; }
.cal, .params, .sim { padding: 14px 16px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); margin-bottom: 14px; }
.sim { border-color: rgba(184,164,255,.45); }
.calBtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.grid1 { display: grid; gap: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); column-gap: 28px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 24px; padding: 10px 16px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); margin-bottom: 16px; }
.sl { display: grid; grid-template-columns: 150px minmax(0, 1fr) 76px; align-items: center; gap: 12px; padding: 7px 0; font-weight: 700; }
.sl span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl output { text-align: right; font-variant-numeric: tabular-nums; color: var(--sun); font-weight: 800; font-size: 13px; }
.sl input { width: 100%; accent-color: var(--coral); }
.foot { display: flex; justify-content: flex-end; }
.foot button { padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--dim); font-weight: 700; }
.foot button:hover { color: var(--danger); border-color: var(--danger); }

/* ── console ── */
.mixer { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 14px; }
.strip { flex: 0 0 86px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); }
.strip.master { border-color: var(--sun); background: linear-gradient(var(--ink-2), #2a2640); margin-left: 8px; }
.strip.muted { opacity: .55; }
.strip.soloed { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(255,209,102,.3); }
.strip .ic { font-size: 20px; }
.fz { display: flex; gap: 8px; height: 240px; align-items: stretch; }
.mt { width: 14px; height: 100%; border-radius: 4px; }
.vf { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 100%; accent-color: var(--sun); margin: 0; }
.strip output { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--sun); font-size: 12px; }
.ms { display: flex; gap: 4px; }
.ms button { width: 30px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--ink); font-weight: 900; font-size: 12px; }
.ms button[data-mute].on { background: var(--danger); border-color: var(--danger); }
.ms button[data-solo].on { background: var(--sun); color: var(--ink); border-color: var(--sun); }
.tst { width: 38px; height: 30px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--ink); }
.tst:hover { border-color: var(--mint); color: var(--mint); }
.strip .nm { font-weight: 800; font-size: 12px; text-align: center; color: var(--muted); line-height: 1.15; min-height: 28px; }
.gr { font-size: 11px; color: var(--dim); font-weight: 700; }
.gr.on b { color: var(--coral); }

/* ── réverb ── */
.revTest { padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--deep); max-width: 220px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.presets button { display: grid; justify-items: center; gap: 2px; min-width: 104px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--ink-2); font-weight: 800; }
.presets button i { font-style: normal; font-size: 22px; }
.presets button small { color: var(--dim); font-weight: 700; }
.presets button:hover { border-color: var(--cream); }
.presets button.on { border-color: var(--mint); background: rgba(94,242,194,.12); box-shadow: 3px 3px 0 var(--mint); }
.pcustom { color: var(--dim); font-weight: 800; padding: 6px 10px; border-radius: 999px; border: 1.5px dashed var(--line); }
.pcustom.on { color: var(--sun); border-color: var(--sun); }
.revMain { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; align-items: center; padding: 16px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); }
.irBox small { color: var(--dim); font-weight: 600; }
.ir { width: 100%; height: 170px; border-radius: 10px; display: block; margin-bottom: 4px; }
.sends { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.sgrp { padding: 10px 14px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); }
.sgrp h4 { margin: 2px 0 2px; font-size: 13px; }
.sgrp > .sl { border-bottom: 1px dashed var(--line); margin-bottom: 4px; }
.sgrp > .sl span { color: var(--cream); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 6px; align-items: center; }
.srow .sl { grid-template-columns: 130px minmax(0, 1fr) 50px; padding: 3px 0; font-size: 13px; }
.srow .pl, .tracks .pl { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink-3); font-size: 10px; }
.srow .pl:hover, .tracks .pl:hover { background: var(--mint); color: var(--ink); }

/* ── ambiances ── */
.gameNow { padding: 10px 14px; border-radius: 12px; background: var(--ink-2); border: 2px solid var(--line); font-weight: 600; color: var(--muted); max-width: 380px; }
.gameNow b { color: var(--mint); }
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.mood { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: var(--ink-2); border: 2px solid var(--line); transition: border-color .2s, box-shadow .2s; }
.mood.live { border-color: var(--mint); box-shadow: 5px 5px 0 var(--mint); }
.mood.ingame header b::after { content: '🎮 en jeu'; margin-left: 8px; font-size: 11px; background: var(--mint); color: var(--ink); padding: 1px 7px; border-radius: 999px; vertical-align: 2px; }
.mood header { display: flex; gap: 12px; align-items: flex-start; }
.mood header i { font-style: normal; font-size: 28px; line-height: 1; }
.mood header b { font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--sun); }
.mood header small { display: block; color: var(--dim); font-weight: 600; line-height: 1.35; margin-top: 2px; }
.mood .sl { grid-template-columns: 70px minmax(0, 1fr) 64px; }
.tracks { list-style: none; margin: 0; padding: 6px; border-radius: 12px; background: var(--deep); min-height: 56px; display: grid; gap: 3px; align-content: start; }
.tracks li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 24px 24px; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 8px; }
.tracks li:hover { background: var(--ink-2); }
.tracks li.on { background: rgba(255,209,102,.12); outline: 1.5px solid var(--sun); }
.tracks li.miss span { color: var(--danger); text-decoration: line-through; }
.tracks li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.tracks li small { color: var(--dim); font-size: 11px; font-weight: 700; }
.tracks li > button:not(.pl) { border: 0; background: transparent; color: var(--dim); }
.tracks li > button:not(.pl):hover { color: var(--cream); }
.tracks li.empty { display: block; padding: 10px; text-align: center; }
.mood footer { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.mood footer button { padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); font-weight: 800; font-size: 12.5px; }
.mood footer button:hover { border-color: var(--cream); }
.mood footer button.on { background: var(--mint); color: var(--ink); border-color: var(--mint); }
.mood footer [data-madd] { color: var(--mint); border-style: dashed; }

/* ── bibliothèque ── */
.right { grid-area: right; display: flex; flex-direction: column; min-height: 0; border-left: 2px solid var(--line); background: var(--ink); }
.right > header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0; }
.right > header b { font-family: var(--f-display); font-weight: 400; color: var(--sun); font-size: 15px; }
.right > header small { color: var(--dim); font-weight: 800; margin-right: auto; }
.drop { display: grid; gap: 2px; justify-items: center; margin: 10px 12px 0; padding: 14px; border-radius: 14px; border: 2px dashed var(--mint); background: rgba(94,242,194,.05); cursor: pointer; text-align: center; }
.drop b { color: var(--mint); }
.drop small { color: var(--dim); font-weight: 600; }
.drop:hover { background: rgba(94,242,194,.12); }
.lList { flex: 1; overflow: auto; list-style: none; margin: 0; padding: 0 8px 10px; }
.lList li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 9px; cursor: grab; }
.lList li:hover { background: var(--ink-2); }
.lList .lp { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink-3); font-size: 10px; }
.lList .lp:hover { background: var(--mint); color: var(--ink); }
.lList .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.lList .nm em { font-style: normal; color: var(--dim); font-weight: 600; }
.lList small { color: var(--dim); font-size: 11px; }
.use { min-width: 22px; text-align: center; border-radius: 999px; background: var(--mint); color: var(--ink); font-size: 11px; padding: 1px 5px; }
.use.none { background: transparent; color: var(--dim); }
.lHelp { padding: 10px 14px; border-top: 2px solid var(--line); color: var(--dim); font-size: 12px; line-height: 1.4; }

/* ── bas, notifications, dépôt, sélecteur ── */
.keys { grid-area: keys; display: flex; gap: 16px; flex-wrap: wrap; padding: 7px 16px; border-top: 2px solid var(--line); background: var(--ink-2); color: var(--dim); font-size: 12px; font-weight: 600; }
.toasts { position: fixed; right: 16px; bottom: 50px; display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { padding: 10px 14px; border-radius: 14px; background: var(--ink-2); border: 2px solid var(--mint); box-shadow: 4px 4px 0 var(--deep); animation: tin .25s ease-out; transition: opacity .35s, transform .35s; }
.toast.bad { border-color: var(--danger); }
.toast b { display: block; }
.toast small { display: block; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.toast.out { opacity: 0; transform: translateX(20px); }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
.dropOverlay { position: fixed; inset: 10px; z-index: 40; display: grid; place-items: center; border: 4px dashed var(--mint); border-radius: 24px; background: rgba(16,22,43,.72); pointer-events: none; }
.dropOverlay div { display: grid; justify-items: center; gap: 4px; }
.dropOverlay b { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--mint); }
.dropOverlay small { color: var(--muted); font-weight: 700; }
.picker { position: fixed; z-index: 60; width: 330px; background: var(--ink-2); border: 2px solid var(--cream); border-radius: 14px; box-shadow: 6px 6px 0 var(--mint); padding: 8px; }
.picker input { width: 100%; padding: 7px 10px; border-radius: 9px; border: 2px solid var(--line); background: var(--deep); outline: none; }
.picker ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow: auto; }
.picker li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-weight: 700; }
.picker li small { color: var(--dim); }
.picker li:hover { background: var(--mint); color: var(--ink); }
.picker li:hover small { color: var(--ink); }

@media (max-width: 1150px) {
  .studio { grid-template-columns: 250px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) minmax(0, .8fr) auto; grid-template-areas: "top top" "ban ban" "left main" "right main" "keys keys"; }
  .right { border-left: 0; border-right: 2px solid var(--line); border-top: 2px solid var(--line); }
  .revMain { grid-template-columns: 1fr; }
}
